<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu 加载动画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.linux-loader{
    width:48px;
    height:48px;
    position:relative;
}
.linux-loader span{
    position:absolute;
    width:100%;
    height:100%;
    border:3px solid transparent;
    border-top-color:#ffffff;
    border-radius:50%;
    animation: linux-spin 1.2s linear infinite;
}
.linux-loader span:nth-child(2){animation-delay: -0.4s;}
.linux-loader span:nth-child(3){animation-delay: -0.8s;}

@keyframes linux-spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}
</style>
</head>
<body>
<div class="linux-loader">
    <span></span>
    <span></span>
    <span></span>
</div>
</body>
</html>
